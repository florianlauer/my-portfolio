name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check (fmt, lint, types)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs Vite+, Node and pnpm (from packageManager), then runs `vp install`.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: 22
          cache: true

      - name: Run vp check
        run: vp check

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: 22
          cache: true

      - name: Run vp test
        run: vp test run

  build:
    name: Build (vp build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: 22
          cache: true

      - name: Build app
        run: vp build
